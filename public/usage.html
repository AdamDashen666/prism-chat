<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>用量统计 · PRISM</title>
  <script src="/chat/embed.js?v=4"></script>
  <link rel="stylesheet" href="/chat/app.css?v=13">
  <link rel="stylesheet" href="/chat/page.css?v=4">
  <link rel="stylesheet" href="/chat/usage.css?v=3">
  <script type="module" src="/chat/usage.js?v=3"></script>
  <script defer src="/chat/ambient.js?v=2"></script>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/><path d="m14.5 14.5 3 3"/></symbol>
  <symbol id="i-codex" viewBox="0 0 24 24"><path d="m7 8-4 4 4 4M17 8l4 4-4 4M14 4l-4 16"/></symbol>
  <symbol id="i-relay" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></symbol>
</svg>
<div class="shell page-shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="站点侧栏">
    <div class="sidebar-head">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg><use href="#i-key"/></svg></span><span>PRISM</span></a>
      <button id="close-sidebar" class="icon-button ghost mobile-only" type="button" aria-label="关闭侧栏"><svg><use href="#i-x"/></svg></button>
    </div>
    <nav class="site-nav" aria-label="站点导航">
      <a href="/"><svg><use href="#i-key"/></svg>API 管理</a>
      <a href="/chat"><svg><use href="#i-chat"/></svg>模型对话</a>
      <a href="/chat/trace"><svg><use href="#i-scan"/></svg>模型检测</a>
      <a class="active" href="/chat/usage" aria-current="page"><svg><use href="#i-chart"/></svg>用量统计</a>
      <a href="/chat/relays"><svg><use href="#i-relay"/></svg>API 中转</a>
      <a href="/chat/codex" data-admin-only hidden><svg><use href="#i-codex"/></svg>Codex 转发</a>
      <a href="/admin/streaks"><svg><use href="#i-flame"/></svg>续火花管理</a>
    </nav>
    <div class="side-note">
      <p>只统计通过本站发出的请求（模型对话、图片生成、模型检测、鹈鹕测试），从 2026 年 10 月起开始记录。中转站后台的计费以它自己的账单为准。</p>
    </div>
    <div class="sidebar-user"><span id="user-avatar" class="avatar" aria-hidden="true"></span><span id="user-name">正在确认登录…</span></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="page-main" id="main">
    <header class="page-top">
      <button id="open-sidebar" class="icon-button ghost mobile-only" type="button" aria-label="打开侧栏" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
      <div>
        <p class="page-eyebrow">USAGE</p>
        <h1>用量统计</h1>
        <p>你发出的请求、消耗的 tokens 和生成的图片，按天（北京时间）、API 和模型汇总。只有你自己能看到。</p>
      </div>
    </header>

    <div class="usage-filters" aria-label="筛选">
      <div class="segmented range" id="range" role="radiogroup" aria-label="时间范围">
        <button type="button" role="radio" aria-checked="false" data-days="1">今天</button>
        <button type="button" role="radio" aria-checked="false" data-days="7">近 7 天</button>
        <button type="button" role="radio" aria-checked="true" data-days="30">近 30 天</button>
        <button type="button" role="radio" aria-checked="false" data-days="90">近 90 天</button>
      </div>
      <label class="filter"><span>API</span><select id="filter-account"><option value="">全部</option></select></label>
      <label class="filter"><span>类型</span>
        <select id="filter-kind">
          <option value="">全部</option>
          <option value="chat">对话</option>
          <option value="image">图片生成</option>
          <option value="trace">模型检测</option>
          <option value="pelican">鹈鹕测试</option>
        </select>
      </label>
      <button id="reload" class="icon-button" type="button" aria-label="刷新" title="刷新"><svg><use href="#i-refresh"/></svg></button>
    </div>

    <div id="content" class="usage-content">
      <section class="kpis" id="kpis" aria-label="汇总"></section>

      <section class="card chart-card" aria-labelledby="chart-title">
        <div class="card-head">
          <h2 id="chart-title">每日 tokens</h2>
          <div class="legend" aria-hidden="true">
            <span><i class="key input"></i>输入</span>
            <span><i class="key output"></i>输出</span>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <details class="daily">
          <summary>按日明细</summary>
          <div id="daily-table" class="table-wrap-usage"></div>
        </details>
      </section>

      <div class="usage-grid">
        <section class="card" aria-labelledby="by-account-title">
          <h2 id="by-account-title">按 API</h2>
          <div id="by-account" class="table-wrap-usage"></div>
        </section>
        <section class="card" aria-labelledby="by-model-title">
          <h2 id="by-model-title">按模型</h2>
          <div id="by-model" class="table-wrap-usage"></div>
        </section>
      </div>
    </div>

    <div id="notice" class="notice" role="alert"></div>
  </main>
</div>
</body>
</html>
